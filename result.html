<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Capture Result</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f5f5f5; }
    pre { background: white; padding: 15px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h2>Capture Result</h2>
  <pre id="output">Loading...</pre>

  <script>
    const params = new URLSearchParams(window.location.search);
    const pid = params.get("pid");
    document.getElementById("output").textContent = pid
      ? decodeURIComponent(pid)
      : "No data received.";
  </script>
</body>
</html>
